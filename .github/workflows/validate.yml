name: validate

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      # Install ShellCheck only when it is missing.
      #
      # The GitHub-hosted Ubuntu image already ships it, so on CI this step
      # runs no apt at all. That matters: the previous unconditional
      # `sudo apt-get update` refreshed every configured repository, including
      # third-party ones this job never uses, and a Hash Sum mismatch on
      # dl.google.com failed the whole run -- while apt itself reported
      # "shellcheck is already the newest version".
      #
      # The install path is kept for `act`, whose default image
      # (catthehacker/ubuntu:act-latest) does NOT ship ShellCheck. Dropping it
      # would make the job pass on GitHub and fail locally, which defeats
      # mirroring the job before pushing. The fallback tolerates a partial
      # `update` so one flaky third-party index cannot break it either.
      #
      # `--version` records which binary actually ran: when the image supplies
      # it, the version can move without a commit here.
      - name: ShellCheck plugin scripts
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq -o Acquire::Retries=3 || true
            sudo apt-get install -y --no-install-recommends shellcheck
          fi
          shellcheck --version
          shellcheck scripts/*.sh scripts/lib/*.sh bin/*

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin manifest
        run: claude plugin validate . --strict
